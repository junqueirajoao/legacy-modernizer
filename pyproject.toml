[project]
name = "legacy-modernizer"
version = "0.1.0"
description = "Ferramenta de auxílio à modernização de sistemas legados COBOL para Python"
requires-python = ">=3.9"
readme = "README.md"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
